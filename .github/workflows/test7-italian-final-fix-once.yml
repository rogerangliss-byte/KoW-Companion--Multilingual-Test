name: TEST7 final Italian runtime fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test7-italian-final-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply TEST7 Italian final runtime fix
        shell: python
        run: |
          from pathlib import Path

          p=Path('lang/clean-i18n.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v4.5.0 TEST6 — clean multilingual runtime','v4.5.0 TEST7 — clean multilingual runtime')
          old="function processTextNode(n,l,d){if(!n||n.nodeType!==3||!n.parentElement)return;if(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','CODE','PRE'].includes(n.parentElement.tagName))return;const base=canonicalText(n),next=l==='en'?base:translateStructured(base,d,l);textLast.set(n,next);if(n.nodeValue!==next)n.nodeValue=next}"
          new="function processTextNode(n,l,d){if(!n||n.nodeType!==3||!n.parentElement)return;if(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','CODE','PRE'].includes(n.parentElement.tagName))return;const base=canonicalText(n);let next=l==='en'?base:translateStructured(base,d,l);if(l==='it'){next=next.split('Inventory → Officer → Stars → Sviluppo → XP → Planner → Save Progress').join('Inventario → Ufficiale → Stelle → Sviluppo → XP → Pianificatore → Salva progressi').split('Inventory → Officer → Stars → Sviluppo → XP → Planner → Salva progressi').join('Inventario → Ufficiale → Stelle → Sviluppo → XP → Pianificatore → Salva progressi').split('🏅 Officer Sviluppo').join('🏅 Sviluppo Ufficiale').split('Save Progress').join('Salva progressi')}textLast.set(n,next);if(n.nodeValue!==next)n.nodeValue=next}"
          if old not in s:
              raise SystemExit('processTextNode anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          q=Path('lang/clean-qa.js')
          t=q.read_text(encoding='utf-8').replace('v4.5.0 TEST6 — runtime multilingual QA','v4.5.0 TEST7 — runtime multilingual QA').replace("QA_VERSION='v450-test6-runtime'","QA_VERSION='v450-test7-runtime'")
          q.write_text(t,encoding='utf-8')

          i=Path('index.html')
          x=i.read_text(encoding='utf-8').replace('v=450-test6','v=450-test7')
          i.write_text(x,encoding='utf-8')

          sw=Path('service-worker.js')
          z=sw.read_text(encoding='utf-8').replace('kow-multilingual-test-v4.5.0-test6','kow-multilingual-test-v4.5.0-test7')
          sw.write_text(z,encoding='utf-8')

          a=Path('lang/v450-language-additions.js')
          if a.exists():
              y=a.read_text(encoding='utf-8').replace('v4.5.0 TEST6 — v4.5 language additions and full Help','v4.5.0 TEST7 — v4.5 language additions and full Help')
              a.write_text(y,encoding='utf-8')

      - name: Verify TEST7
        shell: bash
        run: |
          set -euo pipefail
          grep -q "QA_VERSION='v450-test7-runtime'" lang/clean-qa.js
          grep -q 'v=450-test7' index.html
          grep -q 'kow-multilingual-test-v4.5.0-test7' service-worker.js
          grep -q "split('Save Progress').join('Salva progressi')" lang/clean-i18n.js
          grep -q "split('🏅 Officer Sviluppo').join('🏅 Sviluppo Ufficiale')" lang/clean-i18n.js

      - name: Commit TEST7 and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/test7-italian-final-fix-once.yml
          git add index.html service-worker.js lang/clean-i18n.js lang/clean-qa.js lang/v450-language-additions.js
          git commit -m 'Multilingual v4.5.0 TEST7 final Italian runtime fix'
          git push origin main
