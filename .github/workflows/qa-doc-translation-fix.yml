name: Apply v4.4.0 Help Translation Fix
on:
  push:
    paths:
      - '.qa-doc-translation-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rendered Help translations and cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          marker='</body>'
          if 'v440-help-doc-translation-final' not in h:
              script=r'''<script id="v440-help-doc-translation-final">
(function(){
'use strict';
const FIX={
fr:[
[`Planification avancée multi-Officiers can now select a future Officer session and a specific future Officer Type: Char, Chasseur de chars, Infanterie, Rally or Garnison. Session defaults can be overridden manually. Future entries are clearly marked PROJETÉ, MAXED Officers are excluded, and the Home Préparation de l’Officier card includes an Open Progression des Officiers shortcut.`,`La Planification avancée multi-Officiers permet désormais de sélectionner une future session d’Officier et un Type d’Officier futur précis : Char, Chasseur de chars, Infanterie, Ralliement ou Garnison. Les valeurs par défaut de la session peuvent être remplacées manuellement. Les entrées futures sont clairement marquées PROJETÉ, les Officiers MAX sont exclus et la carte Préparation de l’Officier de l’écran d’accueil comprend un raccourci Ouvrir la Progression des Officiers.`],
[`for Unlock, Next Star, 5★, Skills, Training, Level 70 XP and Officier MAX. Guided Workflow steps are clickable and take you directly to each stage.`,`pour Déblocage, Étoile suivante, 5★, Compétences, Entraînement, XP niveau 70 et Officier MAX. Les étapes du Flux guidé sont cliquables et vous conduisent directement à chaque étape.`],
[`The Home screen now guides users through the recommended Inventory-first workflow and shows the next suggested step. A new Inventory Readiness panel summarises saved badge resources, Star value, XP and individual Insignes d’officier. Tableau de bord shortcut buttons take you directly to the relevant calculator.`,`L’écran d’accueil guide désormais les utilisateurs dans le flux recommandé en commençant par l’Inventaire et affiche l’étape suivante suggérée. Un nouveau panneau Préparation de l’Inventaire résume les ressources de Badges enregistrées, la valeur d’Étoiles, les XP et les Insignes d’officier individuels. Les boutons de raccourci du Tableau de bord conduisent directement au calculateur concerné.`]
],
de:[
[`Erweiterte Multi-Offizier-Planung can now select a future Officer session and a specific future Officer Type: Panzer, Jagdpanzer, Infanterie, Rally or Garnison. Session defaults can be overridden manually. Future entries are clearly marked PROGNOSTIZIERT, MAXED Officers are excluded, and the Home Offiziersbereitschaft card includes an Open Offiziersfortschritt shortcut.`,`Die Erweiterte Multi-Offizier-Planung kann jetzt eine zukünftige Offizierssitzung und einen bestimmten zukünftigen Offizierstyp auswählen: Panzer, Jagdpanzer, Infanterie, Rallye oder Garnison. Sitzungsstandardwerte können manuell überschrieben werden. Zukünftige Einträge sind klar als PROGNOSTIZIERT markiert, MAX-Offiziere werden ausgeschlossen und die Karte Offiziersbereitschaft auf der Startseite enthält eine Verknüpfung Offiziersfortschritt öffnen.`],
[`for Unlock, Next Star, 5★, Skills, Training, Level 70 XP and Offizier MAX. Guided Workflow steps are clickable and take you directly to each stage.`,`für Freischalten, Nächster Stern, 5★, Fähigkeiten, Training, Stufe-70-XP und Offizier MAX. Die Schritte des geführten Arbeitsablaufs sind anklickbar und führen direkt zur jeweiligen Stufe.`],
[`The Home screen now guides users through the recommended Inventory-first workflow and shows the next suggested step. A new Inventory Readiness panel summarises saved badge resources, Star value, XP and individual Offiziersabzeichen. Übersichtsseite shortcut buttons take you directly to the relevant calculator.`,`Die Startseite führt Benutzer jetzt durch den empfohlenen Arbeitsablauf, beginnend mit dem Inventar, und zeigt den nächsten vorgeschlagenen Schritt an. Ein neues Inventarbereitschaft-Feld fasst gespeicherte Abzeichenressourcen, Sternwert, XP und individuelle Offiziersabzeichen zusammen. Die Schaltflächen der Übersichtsseite führen direkt zum entsprechenden Rechner.`]
],
it:[
[`for Unlock, Next Star, 5★, Skills, Training, Level 70 XP and Ufficiale MAX. Guided Workflow steps are clickable and take you directly to each stage.`,`per Sblocco, Stella successiva, 5★, Abilità, Addestramento, XP livello 70 e Ufficiale MAX. I passaggi del Flusso guidato sono selezionabili e portano direttamente a ciascuna fase.`],
[`The Home screen now guides users through the recommended Inventory-first workflow and shows the next suggested step. A new Inventory Readiness panel summarises saved badge resources, Star value, XP and individual Officer Badges. Dashboard intelligente shortcut buttons take you directly to the relevant calculator.`,`La schermata Home ora guida gli utenti nel flusso consigliato partendo dall’Inventario e mostra il passaggio successivo suggerito. Un nuovo pannello Preparazione Inventario riepiloga le risorse Badge salvate, il valore Stelle, gli XP e i Badge Ufficiale individuali. I pulsanti di scelta rapida della Dashboard intelligente portano direttamente al calcolatore pertinente.`]
]};
function lang(){return (localStorage.getItem('appLanguage')||localStorage.getItem('kow_language')||document.documentElement.lang||'en').slice(0,2).toLowerCase()}
function apply(){const l=lang(),box=document.getElementById('helpLanguageBody');if(!box||!FIX[l])return;let html=box.innerHTML;for(const [a,b] of FIX[l])html=html.split(a).join(b);if(html!==box.innerHTML)box.innerHTML=html;}
document.addEventListener('DOMContentLoaded',()=>{setTimeout(apply,120);setTimeout(apply,500)});
document.addEventListener('change',e=>{if(e.target?.id==='appLanguage')setTimeout(apply,180)});
document.addEventListener('click',e=>{if(e.target?.id==='runLanguageQa'||e.target?.closest?.('[data-view="help"]'))setTimeout(apply,100)});
window.__kowV440FixHelpTranslations=apply;
})();
</script>'''
              if marker not in h:
                  raise SystemExit('Missing </body> marker')
              h=h.replace(marker,script+'\n'+marker,1)
              p.write_text(h,encoding='utf-8')
          sw=Path('service-worker.js')
          s=sw.read_text(encoding='utf-8')
          import re
          s=re.sub(r"const CACHE='[^']+';","const CACHE='kow-multilingual-v4.4.0-test4-help-translation-fix';",s,1)
          sw.write_text(s,encoding='utf-8')
          PY
          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add index.html service-worker.js
          git commit -m 'Fix v4.4.0 Help translations detected by strict QA'
          git push
