name: TEST5 final language fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test5-final-language-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final runtime translations and cache bust
        shell: python
        run: |
          from pathlib import Path
          p=Path('lang/clean-i18n.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("fr:[[", "fr:[['Inventory → Officer → Stars → Development → XP → Planner → Save Progress','Inventaire → Officier → Étoiles → Développement → XP → Planificateur → Enregistrer la progression'],['uses Legendary Star I / II / III. Star Readiness Vouchers (SRV) are available only for eligible Legendary seasonal Officers from S2 onward. Original Legendary Officers cannot use SRV.','utilise Étoile légendaire I / II / III. Les Bons de préparation d’étoile (SRV) sont disponibles uniquement pour les Officiers légendaires saisonniers éligibles à partir de S2. Les Officiers légendaires originaux ne peuvent pas utiliser de SRV.'],['🏅 Officer Development','🏅 Développement de l’Officier'],['Projected Officers','Officiers prévus'],['Save progress for the Officers you are considering, then run the analysis.','Enregistrez la progression des Officiers que vous envisagez, puis lancez l’analyse.'],['Use the Planner to compare your current saved Officers and Inventory against projected future Officer sessions, including expected resources for one or two future Officers.','Utilisez le Planificateur pour comparer vos Officiers enregistrés actuels et votre Inventaire aux sessions d’Officiers futures prévues, y compris les ressources attendues pour un ou deux futurs Officiers.'],[")
          s=s.replace("de:[[", "de:[['Inventory → Officer → Stars → Development → XP → Planner → Save Progress','Inventar → Offizier → Sterne → Entwicklung → XP → Planer → Fortschritt speichern'],['Priority: Development','Priorität: Entwicklung'],['uses Legendary Star I / II / III. Star Readiness Vouchers (SRV) are available only for eligible Legendary seasonal Officers from S2 onward. Original Legendary Officers cannot use SRV.','verwendet Legendär Stern I / II / III. Sternbereitschaftsgutscheine (SRV) sind nur für berechtigte saisonale legendäre Offiziere ab S2 verfügbar. Ursprüngliche legendäre Offiziere können keine SRV verwenden.'],['🏅 Officer Development','🏅 Offiziersentwicklung'],['Projected Officers','Geplante Offiziere'],['Save progress for the Officers you are considering, then run the analysis.','Speichern Sie den Fortschritt der Offiziere, die Sie in Betracht ziehen, und führen Sie dann die Analyse aus.'],['Use the Planner to compare your current saved Officers and Inventory against projected future Officer sessions, including expected resources for one or two future Officers.','Verwenden Sie den Planer, um Ihre aktuell gespeicherten Offiziere und Ihr Inventar mit geplanten zukünftigen Offizierssitzungen zu vergleichen, einschließlich der erwarteten Ressourcen für einen oder zwei zukünftige Offiziere.'],[")
          s=s.replace("it:[[", "it:[['Priority: Development','Priorità: Sviluppo'],['Development','Sviluppo'],['uses Legendary Star I / II / III. Star Readiness Vouchers (SRV) are available only for eligible Legendary seasonal Officers from S2 onward. Original Legendary Officers cannot use SRV.','utilizza Stella Leggendaria I / II / III. I Buoni preparazione stella (SRV) sono disponibili solo per gli Ufficiali Leggendari stagionali idonei dalla S2 in poi. Gli Ufficiali Leggendari originali non possono utilizzare SRV.'],['Projected Officers','Ufficiali previsti'],['Save progress for the Officers you are considering, then run the analysis.','Salva i progressi degli Ufficiali che stai considerando, quindi esegui l’analisi.'],['Use the Planner to compare your current saved Officers and Inventory against projected future Officer sessions, including expected resources for one or two future Officers.','Usa il Pianificatore per confrontare gli Ufficiali attualmente salvati e l’Inventario con le sessioni future previste degli Ufficiali, incluse le risorse previste per uno o due futuri Ufficiali.'],[")
          s=s.replace('v4.5.0 TEST4 — clean multilingual runtime','v4.5.0 TEST5 — clean multilingual runtime')
          p.write_text(s,encoding='utf-8')

          q=Path('lang/clean-qa.js')
          t=q.read_text(encoding='utf-8').replace('v4.5.0 TEST4 — runtime multilingual QA','v4.5.0 TEST5 — runtime multilingual QA').replace("QA_VERSION='v450-test4-runtime'","QA_VERSION='v450-test5-runtime'")
          q.write_text(t,encoding='utf-8')

          i=Path('index.html')
          x=i.read_text(encoding='utf-8').replace('v=450-test4','v=450-test5')
          i.write_text(x,encoding='utf-8')

          v=Path('lang/v450-language-additions.js')
          if v.exists():
              z=v.read_text(encoding='utf-8').replace('v4.5.0 TEST4 — v4.5 language additions and Help','v4.5.0 TEST5 — v4.5 language additions and Help')
              v.write_text(z,encoding='utf-8')
      - name: Verify TEST5
        shell: bash
        run: |
          set -euo pipefail
          grep -q "QA_VERSION='v450-test5-runtime'" lang/clean-qa.js
          grep -q 'lang/clean-i18n.js?v=450-test5' index.html
          grep -q 'Projected Officers' lang/clean-i18n.js
          grep -q 'Officiers prévus' lang/clean-i18n.js
          grep -q 'Geplante Offiziere' lang/clean-i18n.js
          grep -q 'Ufficiali previsti' lang/clean-i18n.js
      - name: Commit final corrections and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/test5-final-language-fix-once.yml
          git add index.html lang/clean-i18n.js lang/clean-qa.js lang/v450-language-additions.js
          git commit -m 'Multilingual v4.5.0 TEST5 final runtime language corrections'
          git push origin main
