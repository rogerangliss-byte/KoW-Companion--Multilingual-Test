name: Source Language Sync v4.4.0
on:
  push:
    paths:
      - '.source-language-sync-trigger'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronise v4.4.0 multilingual source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
            "Planification avancée multi-Officiers can now select a future Officer session and a specific future Officer Type: Char, Chasseur de chars, Infanterie, Rally or Garnison. Session defaults can be overridden manually. Future entries are clearly marked PROJETÉ, MAXED Officers are excluded, and the Home Préparation de l’Officier card includes an Open Progression des Officiers shortcut.":
            "La Planification avancée multi-Officiers permet désormais de sélectionner une future session d’Officier et un Type d’Officier futur précis : Char, Chasseur de chars, Infanterie, Ralliement ou Garnison. Les valeurs par défaut de la session peuvent être remplacées manuellement. Les entrées futures sont clairement marquées PROJETÉ, les Officiers MAX sont exclus et la carte Préparation de l’Officier de l’écran d’accueil comprend un raccourci Ouvrir la Progression des Officiers.",
            "for Unlock, Next Star, 5★, Skills, Training, Level 70 XP and Officier MAX. Guided Workflow steps are clickable and take you directly to each stage.":
            "pour Déblocage, Étoile suivante, 5★, Compétences, Entraînement, XP niveau 70 et Officier MAX. Les étapes du Flux guidé sont cliquables et vous conduisent directement à chaque étape.",
            "The Home screen now guides users through the recommended Inventory-first workflow and shows the next suggested step. A new Inventory Readiness panel summarises saved badge resources, Star value, XP and individual Insignes d’officier. Tableau de bord shortcut buttons take you directly to the relevant calculator.":
            "L’écran d’accueil guide désormais les utilisateurs dans le flux recommandé en commençant par l’Inventaire et affiche l’étape suivante suggérée. Un nouveau panneau Préparation de l’Inventaire résume les ressources de Badges enregistrées, la valeur d’Étoiles, les XP et les Insignes d’officier individuels. Les boutons de raccourci du Tableau de bord conduisent directement au calculateur concerné.",
            "for Unlock, Next Star, 5★, Skills, Training, Level 70 XP and Offizier MAX. Guided Workflow steps are clickable and take you directly to each stage.":
            "für Freischalten, Nächster Stern, 5★, Fähigkeiten, Training, Stufe-70-XP und Offizier MAX. Die Schritte des geführten Arbeitsablaufs sind anklickbar und führen direkt zur jeweiligen Stufe.",
            "The Home screen now guides users through the recommended Inventory-first workflow and shows the next suggested step. A new Inventory Readiness panel summarises saved badge resources, Star value, XP and individual Offiziersabzeichen. Übersichtsseite shortcut buttons take you directly to the relevant calculator.":
            "Die Startseite führt Benutzer jetzt durch den empfohlenen Arbeitsablauf, beginnend mit dem Inventar, und zeigt den nächsten vorgeschlagenen Schritt an. Ein neues Inventarbereitschaft-Feld fasst gespeicherte Abzeichenressourcen, Sternwert, XP und individuelle Offiziersabzeichen zusammen. Die Schaltflächen der Übersichtsseite führen direkt zum entsprechenden Rechner.",
            "for Unlock, Next Star, 5★, Skills, Training, Level 70 XP and Ufficiale MAX. Guided Workflow steps are clickable and take you directly to each stage.":
            "per Sblocco, Stella successiva, 5★, Abilità, Addestramento, XP livello 70 e Ufficiale MAX. I passaggi del Flusso guidato sono selezionabili e portano direttamente a ciascuna fase.",
            "The Home screen now guides users through the recommended Inventory-first workflow and shows the next suggested step. A new Inventory Readiness panel summarises saved badge resources, Star value, XP and individual Officer Badges. Dashboard intelligente shortcut buttons take you directly to the relevant calculator.":
            "La schermata Home ora guida gli utenti nel flusso consigliato partendo dall’Inventario e mostra il passaggio successivo suggerito. Un nuovo pannello Preparazione Inventario riepiloga le risorse Badge salvate, il valore Stelle, gli XP e i Badge Ufficiale individuali. I pulsanti di scelta rapida della Dashboard intelligente portano direttamente al calcolatore pertinente."
          }

          candidates = [Path('index.html'), Path('lang/v440-release-sync.js'), Path('lang/v440-language-qa.js'), Path('qa-v440.js')]
          for p in candidates:
            if not p.exists():
              continue
            s=p.read_text(encoding='utf-8')
            before=s
            for a,b in replacements.items():
              s=s.replace(a,b)
            if s!=before:
              p.write_text(s,encoding='utf-8')
              print('patched',p)

          # Ensure the current v4.4 language source files are actually loaded by index.html.
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          required=[
            'lang/fr.js','lang/de.js','lang/it.js','lang/v440-release-sync.js','lang/v440-language-qa.js'
          ]
          missing=[]
          for src in required:
            if src not in h:
              missing.append(src)
          if missing:
            tags='\n'.join(f'<script src="{src}?v=440-source-sync"></script>' for src in missing)
            h=h.replace('</body>',tags+'\n</body>',1)
            p.write_text(h,encoding='utf-8')
            print('added script loads',missing)

          # Refresh version headers on language source files so GitHub clearly shows v4.4.0 maintenance.
          for lang in ('fr','de','it'):
            p=Path(f'lang/{lang}.js')
            if p.exists():
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'^// KoW Companion v[^\n]+ language file:', '// KoW Companion v4.4.0 TEST language file:', s, count=1)
              p.write_text(s,encoding='utf-8')

          # Cache-bust deployment.
          sw=Path('service-worker.js')
          if sw.exists():
            s=sw.read_text(encoding='utf-8')
            s=re.sub(r"const CACHE='[^']+';", "const CACHE='kow-multilingual-v4.4.0-test5-source-language-sync';", s, count=1)
            sw.write_text(s,encoding='utf-8')
          PY
          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add index.html service-worker.js lang/fr.js lang/de.js lang/it.js lang/v440-release-sync.js lang/v440-language-qa.js qa-v440.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No source changes detected'
          else
            git commit -m 'Synchronise v4.4.0 multilingual source language files'
            git push
          fi
