name: Finalize Multilingual Test v4.4.0 Upgrade
on:
  push:
    paths:
      - '.github/workflows/upgrade-v440-multilingual-test-final.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrected v4.4.0 upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('.github/workflows/upgrade-v440-multilingual-test.yml').read_text(encoding='utf-8')
          start=src.index("          python - <<'PY'")+len("          python - <<'PY'\n")
          end=src.index("\n          PY", start)
          block=src[start:end]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          code=code.replace("'Whats New': 'whatsNewV440' in h,", "'Whats New': True,")
          env={}
          exec(compile(code,'v440_upgrade.py','exec'),env)
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          if 'id="whatsNewV440"' not in h:
              whats=env['whats']
              pattern=r'(<section\b[^>]*\bid=["\']help["\'][^>]*>)'
              h2,n=re.subn(pattern, lambda m:m.group(1)+'\n'+whats, h, count=1, flags=re.I)
              if n==0:
                  # Last-resort safe placement: before closing main, still visible in the app.
                  h2=h.replace('</main>', whats+'\n</main>',1)
              h=h2
          if 'id="whatsNewV440"' not in h:
              raise SystemExit('Could not add v4.4.0 What’s New section')
          p.write_text(h,encoding='utf-8')
          print('FINAL v4.4.0 multilingual patch PASS')
          PY

          cat > README.md <<'EOF'
          # KoW Companion v4.4.0 MULTILINGUAL TEST

          Test environment for KoW Companion v4.4.0 multilingual validation.

          ## Languages
          English, French, German and Italian.

          ## v4.4.0 test focus
          - Planning Readiness Dashboard.
          - Badge, Star and XP readiness for saved planning scenarios.
          - Priority Target and Suggested Next Action guidance.
          - Open in Planner shortcut.
          - Existing language selector/persistence retained.
          - Existing Language QA / Translation Test retained.
          - v4.4 translation coverage added for all four languages.
          - What’s New updated for v4.4.0.

          TEST environment only — not Multilingual Live until approved.
          EOF

          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add index.html service-worker.js README.md RELEASE-v4.4.0-MULTILINGUAL-TEST.md
          git commit -m 'Upgrade Multilingual Test to v4.4.0 with planning readiness and language QA'
          git push
