name: Apply v4.4.0 Strict Language QA
on:
  push:
    paths:
      - '.github/workflows/apply-v440-strict-language-qa.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict full-app language QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          marker='v440-strict-full-language-qa'
          if marker not in h:
              script=r'''\n<script id="v440-strict-full-language-qa">\n(function(){\n'use strict';\nconst APP='4.4.0';\nconst LANGS=['en','fr','de','it'];\nconst N={en:'English',fr:'French',de:'German',it:'Italian'};\nconst stale=/\bv4\.3\.(?:\d+)\b/i;\nconst malformed=/(.)\1{18,}/;\nconst allowedEnglish=new Set(['XP','ORV','SRV','MAX','TEST','PASS','FAIL','WARNING','English','Français','Deutsch','Italiano']);\nfunction sleep(ms){return new Promise(r=>setTimeout(r,ms));}\nasync function applyLang(l){\n const s=document.getElementById('appLanguage');\n if(s){s.value=l;s.dispatchEvent(new Event('change',{bubbles:true}));}\n if(window.kowApplyLanguage)try{window.kowApplyLanguage(l)}catch(e){}\n await sleep(500);\n}\nfunction visibleText(root){\n if(!root)return '';\n return [...root.querySelectorAll('*')].filter(el=>{\n   const cs=getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&!['SCRIPT','STYLE','NOSCRIPT'].includes(el.tagName);\n }).map(el=>el.childNodes.length===1&&el.firstChild?.nodeType===3?el.textContent.trim():'').filter(Boolean).join('\n');\n}\nfunction residualEnglish(text,l){\n if(l==='en')return [];\n const hits=[];\n const phrases=['Help & Instructions','What’s New','What\'s New','Planning Readiness Dashboard','Run Language Test','Download Language Test Report','No language test has been run yet.','Settings','Officer','Planning','Database','Inventory','Compare','Progress','Releases'];\n for(const x of phrases) if(text.includes(x)&&!allowedEnglish.has(x)) hits.push(x);\n return [...new Set(hits)];\n}\nasync function readmeCheck(){\n const out=[];\n try{\n   const r=await fetch('./README.md?qa='+Date.now(),{cache:'no-store'});\n   if(!r.ok)throw new Error('HTTP '+r.status);\n   const t=await r.text();\n   if(!/v4\.4\.0/i.test(t))out.push('README does not identify v4.4.0');\n   if(stale.test(t))out.push('README contains stale v4.3.x version text');\n   if(malformed.test(t))out.push('README contains malformed repeated-character text');\n   if(/final loader integration.*remain required/i.test(t))out.push('README contains obsolete pre-test status text');\n }catch(e){out.push('README could not be validated: '+e.message);}\n return out;\n}\nfunction helpCheck(l){\n const root=document.getElementById('helpLanguageBody')||document.getElementById('help');\n const t=(root?.innerText||'').trim();\n const issues=[];\n if(!t)issues.push('Help / What’s New content is empty');\n if(!/4\.4\.0/.test(t))issues.push('Help / What’s New does not identify v4.4.0');\n if(stale.test(t))issues.push('Help / What’s New contains stale v4.3.x version text');\n if(malformed.test(t))issues.push('Help / What’s New contains malformed repeated-character text');\n const res=residualEnglish(t,l);\n if(res.length)issues.push('Help / What’s New residual English: '+res.join(', '));\n return {issues,residual:res};\n}\nfunction interfaceCheck(l){\n const scope=document.querySelector('.app')||document.body;\n const t=visibleText(scope);\n const issues=[];\n if(malformed.test(t))issues.push('Rendered interface contains malformed repeated-character text');\n const res=residualEnglish(t,l);\n if(res.length)issues.push('Rendered interface residual English: '+res.join(', '));\n return {issues,residual:res};\n}\nasync function testOne(l,scope){\n await applyLang(l);\n const s=document.getElementById('appLanguage');\n const switched=(s&&s.value===l)||document.documentElement.lang.slice(0,2)===l;\n const issues=[];\n if(!switched)issues.push('Language switch failed');\n let help={issues:[],residual:[]}, ui={issues:[],residual:[]}, readme=[];\n if(scope==='full'||scope==='help')help=helpCheck(l);\n if(scope==='full'||scope==='visible')ui=interfaceCheck(l);\n if(scope==='full')readme=await readmeCheck();\n issues.push(...help.issues,...ui.issues,...readme);\n const status=issues.length?'FAIL':'PASS';\n return {language:l,name:N[l],scope,status,switched,sections:{interface:ui.issues.length?'FAIL':'PASS',helpWhatsNew:help.issues.length?'FAIL':'PASS',readme:readme.length?'FAIL':'PASS',versionConsistency:issues.some(x=>/version|v4\.3|v4\.4/.test(x))?'FAIL':'PASS'},issues,residualEnglish:[...new Set([...help.residual,...ui.residual])]};\n}\nasync function runStrict(){\n const target=document.getElementById('languageQaTarget')?.value||'all';\n const scope=document.getElementById('languageQaScope')?.value||'full';\n const langs=target==='all'?LANGS:[target];\n const results=[];\n for(const l of langs)results.push(await testOne(l,scope));\n if(target==='all')await applyLang('en');\n const fails=results.filter(x=>x.status==='FAIL').length;\n const overall=fails?'FAIL':'PASS';\n const report={appVersion:APP,build:'Multilingual v4.4.0 strict rendered-content QA',generated:new Date().toISOString(),scope,overall,interpretation:'Full app PASS requires language switching, rendered interface, Help/What’s New, README and version consistency to all pass.',results};\n window.__kowStrictQaReport=report;\n const sum=document.getElementById('languageQaSummary');\n if(sum)sum.innerHTML='<b>'+overall+'</b> — '+results.length+' language test(s): '+(results.length-fails)+' PASS, 0 WARNING, '+fails+' FAIL. Full app includes rendered Interface, Help/What’s New, README and version consistency.';\n const box=document.getElementById('languageQaResults');\n if(box)box.innerHTML=results.map(x=>'<div class="result-box"><b>'+x.name+' — '+x.status+'</b><br>Switch: '+(x.switched?'PASS':'FAIL')+' · Interface: '+x.sections.interface+' · Help/What’s New: '+x.sections.helpWhatsNew+' · README: '+x.sections.readme+' · Version: '+x.sections.versionConsistency+(x.issues.length?'<br><small>'+x.issues.join(' | ')+'</small>':'')+'</div>').join('');\n const dl=document.getElementById('downloadLanguageQa');if(dl)dl.disabled=false;\n}\nfunction downloadStrict(){\n const r=window.__kowStrictQaReport;if(!r)return;\n const b=new Blob([JSON.stringify(r,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='KoW-Language-QA-v4.4.0-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n}\ndocument.addEventListener('click',e=>{\n if(e.target?.id==='runLanguageQa'){e.preventDefault();e.stopImmediatePropagation();runStrict();}\n if(e.target?.id==='downloadLanguageQa'&&window.__kowStrictQaReport){e.preventDefault();e.stopImmediatePropagation();downloadStrict();}\n},true);\n})();\n</script>\n'''
              if '</body>' not in h: raise SystemExit('index.html has no closing body tag')
              h=h.replace('</body>',script+'\n</body>',1)
          h=h.replace("last={appVersion:'4.3.59'","last={appVersion:'4.4.0'")
          h=h.replace("KoW-Language-QA-v4.3.59-","KoW-Language-QA-v4.4.0-")
          p.write_text(h,encoding='utf-8')

          Path('README.md').write_text('''# KoW Companion v4.4.0 MULTILINGUAL TEST\n\nTest environment for KoW Companion v4.4.0 multilingual validation.\n\n## Languages\nEnglish, French, German and Italian.\n\n## v4.4.0 test focus\n- Planning Readiness Dashboard.\n- Badge, Star and XP readiness for saved planning scenarios.\n- Priority Target and Suggested Next Action guidance.\n- Open in Planner shortcut.\n- Language selector and persistence.\n- Full rendered-content Language QA covering Interface, Help / What’s New, README and version consistency.\n- v4.4.0 translation coverage for English, French, German and Italian.\n\n## QA acceptance rule\nA Full app PASS is only valid when the selected language switches correctly and the rendered Interface, Help / What’s New, README and version consistency all pass. Stale v4.3.x documentation, residual English in tested areas, malformed repeated-character content, empty Help content or a version mismatch must produce FAIL.\n\n## Status\nMultilingual TEST only. The build must receive a clean Full app QA result before promotion to Multilingual Live.\n''',encoding='utf-8')
          PY
          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add index.html README.md
          git commit -m 'Make v4.4.0 multilingual QA validate rendered docs and version consistency' || true
          git rm -f .github/workflows/apply-v440-strict-language-qa.yml
          git commit -m 'Remove one-shot strict QA workflow'
          git push
