name: Retry Multilingual Test v4.4.0 Upgrade
on:
  push:
    paths:
      - '.github/workflows/upgrade-v440-multilingual-test-retry.yml'
permissions:
  contents: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run corrected v4.4.0 upgrade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/upgrade-v440-multilingual-test.yml').read_text(encoding='utf-8')
          start=src.index("          python - <<'PY'")+len("          python - <<'PY'\n")
          end=src.index("\n          PY", start)
          block=src[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          code='\n'.join(lines)
          old="h=h.replace('<h2>❓ Help & Instructions</h2>', '<h2>❓ Help & Instructions</h2>\\n'+whats, 1)"
          new="h=h.replace('<section id=\\\"help\\\" class=\\\"view\\\">', '<section id=\\\"help\\\" class=\\\"view\\\">\\n'+whats, 1)"
          if old not in code:
              raise SystemExit('Could not patch original Help insertion line')
          code=code.replace(old,new)
          exec(compile(code,'v440_upgrade.py','exec'),{})
          PY

          cat > README.md <<'EOF'
          # KoW Companion v4.4.0 MULTILINGUAL TEST

          Test environment for the multilingual KoW Companion.

          ## Languages
          - English
          - French
          - German
          - Italian

          ## v4.4.0 test focus
          - Planning Readiness Dashboard.
          - Saved-target Badge, Star and XP readiness.
          - Priority Target and Suggested Next Action guidance.
          - Existing multilingual selector and persistence retained.
          - Existing Language QA / Translation Test retained and extended with v4.4 dashboard translation coverage.
          - English v4.4.0 functionality carried into the multilingual test environment.

          This repository is TEST only. Do not use it as the Multilingual Live deployment until approved.
          EOF

          git config user.name 'FireStorm'
          git config user.email 'roger.angliss@gmail.com'
          git add index.html service-worker.js README.md RELEASE-v4.4.0-MULTILINGUAL-TEST.md
          git commit -m 'Upgrade Multilingual Test to v4.4.0 with planning readiness and language QA'
          git push
