name: TEST4 one-time cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test4-cache-bust-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TEST4 asset versioning
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v=450-test3','v=450-test4')
          p.write_text(s,encoding='utf-8')
          q=Path('lang/v450-language-additions.js')
          if q.exists():
              t=q.read_text(encoding='utf-8').replace('TEST2 — v4.5 language additions and Help.','TEST4 — v4.5 language additions and Help.')
              q.write_text(t,encoding='utf-8')
      - name: Verify TEST4 references
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'lang/clean-i18n.js?v=450-test4' index.html
          grep -q 'lang/clean-qa.js?v=450-test4' index.html
          grep -q "QA_VERSION='v450-test4-runtime'" lang/clean-qa.js
          grep -q 'v4.5.0 TEST' lang/clean-i18n.js
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/test4-cache-bust-once.yml
          git add index.html lang/v450-language-additions.js
          git commit -m 'Force Multilingual TEST4 runtime assets'
          git push origin main
