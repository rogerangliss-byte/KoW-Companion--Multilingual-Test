name: Rebuild Multilingual Test from English Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-multilingual.yml'
      - 'lang/clean-i18n.js'
      - 'lang/clean-qa.js'
      - 'lang/fr.js'
      - 'lang/de.js'
      - 'lang/it-base-v4357.js'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Multilingual Test
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout English Live baseline
        uses: actions/checkout@v4
        with:
          repository: rogerangliss-byte/KoW-Companion
          ref: main
          path: english-live

      - name: Replace app core with English Live
        shell: bash
        run: |
          set -euo pipefail
          cp english-live/index.html ./index.html
          cp english-live/manifest.json ./manifest.json
          cp english-live/icon.svg ./icon.svg
          cp english-live/background-portrait.jpg ./background-portrait.jpg
          cp english-live/background-landscape.jpg ./background-landscape.jpg
          cp english-live/officers.csv ./officers.csv
          cp english-live/officers.json ./officers.json
          cp english-live/USER-GUIDE.md ./USER-GUIDE.md
          rm -rf officer-portraits
          cp -a english-live/officer-portraits ./officer-portraits
          [ -f english-live/officers-default.csv ] && cp english-live/officers-default.csv ./officers-default.csv || true
          [ -f english-live/officers-default.json ] && cp english-live/officers-default.json ./officers-default.json || true
          rm -f qa-v440.js lang/v440-language-qa.js lang/v440-release-sync.js lang/it.js

      - name: Repair and normalise language sources
        shell: python
        run: |
          from pathlib import Path
          replacements={
            'lang/fr.js':[
              ('"Audit not run yet.": "Audit pas encore exécuté."\n\n  "Planification avancée','"Audit not run yet.": "Audit pas encore exécuté.",\n\n  "Planification avancée'),
              ('"ORV / Badge": "ORV / Badge",','"ORV / Badge": "ORV / Badge d’Officier",')
            ],
            'lang/de.js':[
              ('"Audit not run yet.": "Prüfung noch nicht ausgeführt."\n\n  "for Unlock','"Audit not run yet.": "Prüfung noch nicht ausgeführt.",\n\n  "for Unlock'),
              ('"Status": "Status",','"Status": "Zustand",')
            ],
            'lang/it-base-v4357.js':[
              ('"Home": "Home",','"Home": "Pagina iniziale",'),
              ('"Database": "Database",','"Database": "Banca dati",'),
              ('"ORV / Badge": "ORV / Badge",','"ORV / Badge": "ORV / Distintivo",')
            ]
          }
          for name,pairs in replacements.items():
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

      - name: Inject clean multilingual UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>KoW Companion v4.4.0</title>','<title>KoW Companion v4.4.0 TEST</title>')
          s=s.replace('v4.4.0 LIVE','v4.4.0 TEST')
          banner='''\n<div id="multilingualTestBanner" style="position:sticky;top:0;z-index:99999;background:#a40000;color:#fff;font-weight:800;text-align:center;padding:5px 8px;border-bottom:1px solid #ff7777">MULTILINGUAL TEST — v4.4.0 TEST — CLEAN ENGLISH LIVE REBUILD — NOT LIVE</div>\n'''
          s=s.replace('<body>','<body>'+banner,1)
          lang_ui='''\n      <h3>🌐 Language</h3>\n      <p class="notice">Choose the language used by the app interface. Officer names and game data are not translated.</p>\n      <label for="appLanguage">App language</label>\n      <select id="appLanguage">\n        <option value="en">English</option>\n        <option value="fr">Français</option>\n        <option value="de">Deutsch</option>\n        <option value="it">Italiano</option>\n      </select>\n      <div class="notice">Your language choice is saved automatically on this device.</div>\n'''
          marker='<h2>⚙ Settings</h2>'
          if marker not in s:
              raise SystemExit('Settings marker not found')
          s=s.replace(marker,marker+lang_ui,1)
          scripts='''\n<script src="./lang/en.js?v=440-clean7"></script>\n<script src="./lang/fr.js?v=440-clean7"></script>\n<script src="./lang/de.js?v=440-clean7"></script>\n<script src="./lang/it-base-v4357.js?v=440-clean7"></script>\n<script src="./lang/clean-i18n.js?v=440-clean7"></script>\n<script src="./lang/clean-qa.js?v=440-clean7"></script>\n'''
          s=s.replace('</body>',scripts+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Install recovery service worker
        shell: bash
        run: |
          cat > service-worker.js <<'EOF'
          const PREFIX='kow-';
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith(PREFIX)).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{if(event.request.method==='GET')event.respondWith(fetch(event.request,{cache:'no-store'}));});
          EOF

      - name: Verify clean architecture and language syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f lang/fr.js
          test -f lang/de.js
          test -f lang/it-base-v4357.js
          test -f lang/clean-i18n.js
          test -f lang/clean-qa.js
          node --check lang/en.js
          node --check lang/fr.js
          node --check lang/de.js
          node --check lang/it-base-v4357.js
          node --check lang/clean-i18n.js
          node --check lang/clean-qa.js
          grep -q 'CLEAN ENGLISH LIVE REBUILD' index.html
          grep -q 'id="appLanguage"' index.html
          grep -q 'lang/clean-i18n.js?v=440-clean7' index.html
          grep -q 'lang/clean-qa.js?v=440-clean7' index.html
          grep -q 'Download Runtime QA Report' lang/clean-qa.js
          ! grep -q 'clean-language-qa.js' lang/clean-i18n.js
          ! grep -q 'v440-language-qa.js' index.html
          ! grep -q 'qa-v440.js' index.html
          echo 'Clean multilingual architecture and runtime QA syntax verified.'

      - name: Generate static language QA
        shell: node {0}
        run: |
          const fs=require('fs'),vm=require('vm');
          function load(path,varName){
            const ctx={window:{}};
            vm.createContext(ctx);
            vm.runInContext(fs.readFileSync(path,'utf8'),ctx,{filename:path});
            return ctx.window[varName]||{};
          }
          const dicts={
            en:load('lang/en.js','KOW_I18N_EN'),
            fr:load('lang/fr.js','KOW_I18N_FR'),
            de:load('lang/de.js','KOW_I18N_DE'),
            it:load('lang/it-base-v4357.js','KOW_I18N_IT')
          };
          const source=Object.keys(dicts.en).sort();
          const allowedSame=new Set(['XP','ORV','SRV','MAXED','IN PROGRESS','NOT STARTED','CURRENT','NEXT']);
          const out={qa:'clean7-static-dictionary-only',sourceKeys:source.length,languages:{}};
          for(const lang of ['en','fr','de','it']){
            if(lang==='en'){out.languages.en={status:'PASS',missing:[],sameAsEnglish:[]};continue;}
            const d=dicts[lang];
            const missing=source.filter(k=>!Object.prototype.hasOwnProperty.call(d,k));
            const same=source.filter(k=>Object.prototype.hasOwnProperty.call(d,k)&&d[k]===k&&/[A-Za-z]/.test(k)&&!allowedSame.has(k));
            out.languages[lang]={status:(missing.length||same.length)?'WARNING':'PASS',missing,sameAsEnglish:same};
          }
          fs.writeFileSync('LANGUAGE-QA-STATIC.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          const failed=Object.entries(out.languages).filter(([k,v])=>v.status!=='PASS');
          if(failed.length) process.exitCode=2;

      - name: Remove temporary English Live checkout
        if: always()
        shell: bash
        run: rm -rf english-live

      - name: Commit rebuilt Multilingual Test
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'FireStorm Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No rebuild changes to commit.'
          else
            git commit -m 'Fresh multilingual v4.4.0 TEST rebuild from English Live'
            git push origin main
          fi
